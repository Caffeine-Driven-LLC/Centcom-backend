packages:
  - apps/*
  - packages/*

# Settings (pnpm 11+ reads these here, not from .npmrc).
# No dependency lifecycle scripts run; exceptions need a reviewed allow-list (B001 guardrail).
ignoreScripts: true
# Install fails fast on an unsupported Node version instead of a cryptic build error.
engineStrict: true
# `pnpm add` writes exact versions; ranges are rejected by `pnpm lint` (tools/repo/check-exact-pins.mjs).
saveExact: true

# Supply-chain delay: never install a version published less than 24 h ago. Strict mode makes
# pnpm fail instead of silently adding entries to minimumReleaseAgeExclude.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
# Every exclusion needs a reason and a removal date; delete it once the version is older than 24 h.
minimumReleaseAgeExclude:
  # Added 2026-10-06. vite shipped same-day patches on every supported line (8.3.3, 8.2.4, 8.1.6,
  # 7.3.7, 6.4.4), which usually means a security fix, so we take it instead of 8.3.2.
  # Remove after 2026-10-07T04:10Z (published 2026-10-06T04:10Z).
  - vite@8.3.3
