# B101 secret guard, surface 4 (CI): scans the files git tracks for provider credentials, using the
# patterns of contracts/fixtures/providers/secret-patterns.json. Prints `path:line pattern-id`, never the
# matched text. The allow-list is secret-guard.allow.json (scope `path`, with a reason and an expiry).
# Check name: `secret-guard / secret-guard`.
name: secret-guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1' # weekly, so a new pattern in the contract file is applied to the whole tree

permissions:
  contents: read

concurrency:
  group: secret-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Scan the repository tree (exit 1 on a hit)
        run: pnpm secret-guard:scan --root .
