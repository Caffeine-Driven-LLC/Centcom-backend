# B002: security updates only. `open-pull-requests-limit: 0` turns off routine version-update PRs;
# Dependabot security updates (enabled in the repository settings) still open PRs for advisories.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
