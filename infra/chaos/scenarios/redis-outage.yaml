id: redis-outage
hypothesis: With Redis paused the API reports itself not ready within 15 s but stays alive, and everything is ready again within 30 s of Redis coming back.
target: compose
steady_state:
  - { name: API is ready, http: '${API_URL}/readyz', status: [200], within_s: 30 }
inject:
  - { fault: pause, service: redis, duration_s: 20 }
during:
  - { name: readyz reports 503 within 15 s, http: '${API_URL}/readyz', status: [503], within_s: 15 }
  - { name: healthz stays 200, http: '${API_URL}/healthz', status: [200] }
expect:
  - { name: API is ready again within 30 s, http: '${API_URL}/readyz', status: [200], within_s: 30 }
