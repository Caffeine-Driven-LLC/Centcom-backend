        labels:
          slo: api-availability
      - record: slo:sli_error:ratio_rate3d
        expr: 1 - (sum by (env) (rate(centcom_http_requests_total{route!~"/healthz|/readyz", status_class!="5xx"}[3d])) / sum by (env) (rate(centcom_http_requests_total{route!~"/healthz|/readyz"}[3d])))
        labels:
          slo: api-availability
      - record: slo:burn_rate:5m
        expr: slo:sli_error:ratio_rate5m{slo="api-availability"} / (1 - 0.999)
        labels:
          slo: api-availability
      - record: slo:burn_rate:1h
        expr: slo:sli_error:ratio_rate1h{slo="api-availability"} / (1 - 0.999)
        labels:
          slo: api-availability
      - record: slo:burn_rate:6h
        expr: slo:sli_error:ratio_rate6h{slo="api-availability"} / (1 - 0.999)
        labels:
          slo: api-availability
      - record: slo:burn_rate:3d
