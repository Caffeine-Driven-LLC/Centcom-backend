# API availability: answers that are not 5xx, of all requests but health checks.
# A proposal for the owner to ratify (B093); alert thresholds derived from it live in B094.
name: api-availability
objective: 0.999
window: 30d
owner: platform
sli:
  good: 'centcom_http_requests_total{route!~"/healthz|/readyz", status_class!="5xx"}'
  total: 'centcom_http_requests_total{route!~"/healthz|/readyz"}'
