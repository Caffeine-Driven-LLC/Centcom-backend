# Production stack for ONE small server (B091): Caddy (HTTPS), the API, the relay, the worker,
# Postgres, Redis and MinIO (the S3 store of session history). Cloudflare sits in front of Caddy.
#
#   cp production.env.example production.env      # fill in every CHANGE_ME (see the file)
#   ./deploy.sh <tag>                              # build, back up, migrate, start, check
#
# Only Caddy publishes ports. Everything else lives on the `backend` network, where
# plain-text Postgres and Redis are acceptable (ALLOW_INSECURE_BACKENDS=1 says so explicitly).
# Each service gets only the variables it reads: the relay never sees the token signing key.
# This file is for the layout in docs/ops/capacity.md; it is not a high-availability setup.
name: ${COMPOSE_PROJECT_NAME:-centcom}

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

x-service: &service
  restart: unless-stopped
  logging: *logging
  security_opt: ['no-new-privileges:true']
  cap_drop: ['ALL']

x-image-args: &build-args
  context: ../..
  dockerfile: infra/deploy/Dockerfile
  args:
    SERVICE_VERSION: ${TAG:-local}

# What the API process and the worker read (the worker is the API's code with --worker).
x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL}
  DATABASE_URL: postgres://centcom:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/centcom
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  ALLOW_INSECURE_BACKENDS: '1'
  TRUSTED_PROXY_HOPS: '1'
  AUTH_SIGNING_KEYS: ${AUTH_SIGNING_KEYS:?set AUTH_SIGNING_KEYS}
  AUTH_SIGNING_KID: ${AUTH_SIGNING_KID:?set AUTH_SIGNING_KID}
  IDEMPOTENCY_ENCRYPTION_KEY: ${IDEMPOTENCY_ENCRYPTION_KEY:?set IDEMPOTENCY_ENCRYPTION_KEY}
  CURSOR_SIGNING_KEYS: ${CURSOR_SIGNING_KEYS:?set CURSOR_SIGNING_KEYS}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
  EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
  POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-starttls}
  SMTP_ALLOW_CLEARTEXT_AUTH: ${SMTP_ALLOW_CLEARTEXT_AUTH:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  WEB_BASE_URL: ${WEB_BASE_URL:?set WEB_BASE_URL}
  MAGIC_LINK_BASE_URL: ${PUBLIC_API_URL}
  LOGIN_RETURN_TO_ALLOWLIST: ${LOGIN_RETURN_TO_ALLOWLIST:?set LOGIN_RETURN_TO_ALLOWLIST}
  DEVICE_VERIFICATION_URI: ${PUBLIC_API_URL}/device
  SELF_HOST_PLAN: ${SELF_HOST_PLAN:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  BILLING_MAX_SEATS: ${BILLING_MAX_SEATS:-500}
  STRIPE_PRICE_PRO_MONTH_USD: ${STRIPE_PRICE_PRO_MONTH_USD:-}
  STRIPE_PRICE_TEAM_MONTH_USD: ${STRIPE_PRICE_TEAM_MONTH_USD:-}
  STRIPE_PRICE_SEAT_MONTH_USD: ${STRIPE_PRICE_SEAT_MONTH_USD:-}
  STRIPE_PRICE_PRO_MONTH_EUR: ${STRIPE_PRICE_PRO_MONTH_EUR:-}
  STRIPE_PRICE_TEAM_MONTH_EUR: ${STRIPE_PRICE_TEAM_MONTH_EUR:-}
  STRIPE_PRICE_SEAT_MONTH_EUR: ${STRIPE_PRICE_SEAT_MONTH_EUR:-}
  STRIPE_PRICE_PRO_YEAR_USD: ${STRIPE_PRICE_PRO_YEAR_USD:-}
  STRIPE_PRICE_TEAM_YEAR_USD: ${STRIPE_PRICE_TEAM_YEAR_USD:-}
  STRIPE_PRICE_SEAT_YEAR_USD: ${STRIPE_PRICE_SEAT_YEAR_USD:-}
  STRIPE_PRICE_PRO_YEAR_EUR: ${STRIPE_PRICE_PRO_YEAR_EUR:-}
  STRIPE_PRICE_TEAM_YEAR_EUR: ${STRIPE_PRICE_TEAM_YEAR_EUR:-}
  STRIPE_PRICE_SEAT_YEAR_EUR: ${STRIPE_PRICE_SEAT_YEAR_EUR:-}
  RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:?set RELAY_PUBLIC_URL}
  RELAY_REGION: ${RELAY_REGION:-eu}
  RATELIMIT_AUTH_LIMIT: ${RATELIMIT_AUTH_LIMIT:-20}
  RATELIMIT_ANONYMOUS_LIMIT: ${RATELIMIT_ANONYMOUS_LIMIT:-30}
  OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-http://minio:9000}
  OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-us-east-1}
  OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-history}
  OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:?set OBJECT_STORE_ACCESS_KEY_ID}
  OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:?set OBJECT_STORE_SECRET_ACCESS_KEY}
  # Local drills only (profile `localmail`); empty in production.
  DEV_MAILPIT_URL: ${DEV_MAILPIT_URL:-}

services:
  caddy:
    <<: *service
    image: caddy:2.10-alpine
    # Caddy binds 80/443 (moved by HTTP_PORT/HTTPS_PORT for a drill); it needs that one capability.
    cap_add: ['NET_BIND_SERVICE']
    ports:
      - '${HTTP_PORT:-80}:${HTTP_PORT:-80}'
      - '${HTTPS_PORT:-443}:${HTTPS_PORT:-443}'
    environment:
      API_HOST: ${API_HOST:?set API_HOST}
      RELAY_HOST: ${RELAY_HOST:?set RELAY_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend]
    depends_on:
      api: { condition: service_healthy }
      relay: { condition: service_healthy }

  api:
    <<: *service
    build:
      <<: *build-args
      target: api
    image: centcom-api:${TAG:-local}
    environment:
      <<: *api-env
      SERVICE_NAME: api
    read_only: true
    tmpfs: ['/tmp']
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: *service
    build:
      <<: *build-args
      target: worker
    image: centcom-worker:${TAG:-local}
    environment:
      <<: *api-env
      SERVICE_NAME: worker
    read_only: true
    tmpfs: ['/tmp']
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  relay:
    <<: *service
    build:
      <<: *build-args
      target: relay
    image: centcom-relay:${TAG:-local}
    # The relay drains its WebSockets on SIGTERM (RELAY_SHUTDOWN_DRAIN_MS, 25 s); never cut it short.
    stop_grace_period: 60s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    environment:
      NODE_ENV: production
      SERVICE_NAME: relay
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      DATABASE_URL: postgres://centcom:${POSTGRES_PASSWORD}@postgres:5432/centcom
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ALLOW_INSECURE_BACKENDS: '1'
      RELAY_REGION: ${RELAY_REGION:-eu}
      RELAY_JWKS_URL: http://api:3000/.well-known/jwks.json
      RELAY_ALLOWED_ORIGINS: ${RELAY_ALLOWED_ORIGINS:-}
      RELAY_MAX_CONNECTIONS: ${RELAY_MAX_CONNECTIONS:-5000}
      OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-http://minio:9000}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-us-east-1}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-history}
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY}
    read_only: true
    tmpfs: ['/tmp']
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }

  # One-shot: applies the pending migrations (`docker compose run --rm migrate`). migrate-safe.sh
  # wraps it with a backup first; nothing migrates on service start.
  migrate:
    build:
      <<: *build-args
      target: api
    image: centcom-api:${TAG:-local}
    profiles: ['tools']
    command: ['node', 'node_modules/@centcom/db/dist/cli.js', 'migrate']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://centcom:${POSTGRES_PASSWORD}@postgres:5432/centcom
      ALLOW_INSECURE_BACKENDS: '1'
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }

  # deploy.sh's checks (B092): the smoke test and the SLO guard, run with the new version's Node on
  # the private network. Only the two scripts are mounted (never the settings file); no secret.
  deploy-check:
    image: centcom-api:${TAG:-local}
    profiles: ['tools']
    entrypoint: ['node']
    read_only: true
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    volumes:
      - ./smoke.mjs:/deploy/smoke.mjs:ro
      - ./slo-guard.mjs:/deploy/slo-guard.mjs:ro
    networks: [backend]

  # One-shot: the archive volume belongs to the postgres user, so archive_command can write to it.
  wal-init:
    image: postgres:16
    restart: 'no'
    user: root
    command: ['sh', '-c', 'mkdir -p /wal && chown postgres:postgres /wal && chmod 700 /wal']
    volumes:
      - wal-archive:/wal
    networks: [backend]

  postgres:
    <<: *service
    image: postgres:16
    depends_on:
      wal-init: { condition: service_completed_successfully }
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=1000
      # Point-in-time recovery (docs/ops/backup-and-dr.md): off until PG_ARCHIVE_MODE=on and wal-ship.sh runs.
      - -c
      - wal_level=replica
      - -c
      - archive_mode=${PG_ARCHIVE_MODE:-off}
      - -c
      - archive_timeout=60
      - -c
      - archive_command=test ! -f /wal/%f && cp %p /wal/%f.tmp && mv /wal/%f.tmp /wal/%f
    environment:
      POSTGRES_USER: centcom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: centcom
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - backups:/backups
      - wal-archive:/wal
    networks: [backend]
    healthcheck:
      test: ['CMD', 'pg_isready', '--username=centcom', '--dbname=centcom']
      interval: 5s
      timeout: 3s
      retries: 20
    # Chown/setuid at start-up need the default capabilities; this image is not read-only.
    cap_drop: []

  redis:
    <<: *service
    image: redis:7
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    cap_drop: []

  # S3 store of session history and snapshots. To use Cloudflare R2 or Backblaze B2 instead, set
  # the OBJECT_STORE_* variables to the provider's values and start without this service
  # (`docker compose up -d --scale minio=0 --scale minio-init=0`).
  minio:
    <<: *service
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/bitnami/minio/data
      - ../compose/minio-init.sh:/opt/centcom/minio-init.sh:ro
    networks: [backend]
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
    cap_drop: []

  minio-init:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: 'no'
    entrypoint: ['bash', '/opt/centcom/minio-init.sh']
    environment:
      S3_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_ACCESS_KEY}
    volumes:
      - ../compose/minio-init.sh:/opt/centcom/minio-init.sh:ro
    networks: [backend]
    depends_on:
      minio: { condition: service_healthy }

  # Local drills only: a mail catcher so e-mail sign-in works with no mail provider.
  mailpit:
    image: axllent/mailpit:v1.31.4
    profiles: ['localmail']
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '127.0.0.1:${MAILPIT_HTTP_PORT:-18025}:8025'
    networks: [backend]

networks:
  # One private bridge. No service but Caddy publishes a port, so nothing on it is reachable from
  # outside; the services keep outbound access (mail provider, Stripe, object storage).
  backend: {}

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
  backups:
  wal-archive:
