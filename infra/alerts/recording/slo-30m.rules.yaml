# Generated by infra/alerts/slo-windows.mjs from infra/observability/slo/*.slo.yaml (B094): the
# 30m window of each SLO's error ratio and burn rate, next to B093's 5m, 1h, 6h and 3d.
# Do not edit: change an SLO file and run `node infra/alerts/slo-windows.mjs`.
groups:
  - name: slo-windows-api-availability
    interval: 1m
    rules:
      - record: slo:sli_error:ratio_rate30m
        expr: 1 - (sum by (env) (rate(centcom_http_requests_total{route!~"/healthz|/readyz", status_class!="5xx"}[30m])) / sum by (env) (rate(centcom_http_requests_total{route!~"/healthz|/readyz"}[30m])))
        labels:
          slo: api-availability
      - record: slo:burn_rate:30m
        expr: slo:sli_error:ratio_rate30m{slo="api-availability"} / (1 - 0.999)
        labels:
          slo: api-availability
  - name: slo-windows-api-latency
    interval: 1m
    rules:
      - record: slo:sli_error:ratio_rate30m
        expr: 1 - (sum by (env) (rate(centcom_http_request_duration_seconds_bucket{route!~"/healthz|/readyz", le="0.3"}[30m])) / sum by (env) (rate(centcom_http_request_duration_seconds_count{route!~"/healthz|/readyz"}[30m])))
        labels:
          slo: api-latency
      - record: slo:burn_rate:30m
        expr: slo:sli_error:ratio_rate30m{slo="api-latency"} / (1 - 0.95)
        labels:
          slo: api-latency
  - name: slo-windows-relay-connect
    interval: 1m
    rules:
      - record: slo:sli_error:ratio_rate30m
        expr: 1 - (sum by (env) (rate(centcom_relay_handshake_duration_seconds_bucket{result="ok", le="2"}[30m])) / sum by (env) (rate(centcom_relay_handshake_duration_seconds_count[30m])))
        labels:
          slo: relay-connect
      - record: slo:burn_rate:30m
        expr: slo:sli_error:ratio_rate30m{slo="relay-connect"} / (1 - 0.995)
        labels:
          slo: relay-connect
  - name: slo-windows-relay-fanout
    interval: 1m
    rules:
      - record: slo:sli_error:ratio_rate30m
        expr: 1 - (sum by (env) (rate(centcom_relay_fanout_latency_seconds_bucket{le="0.15"}[30m])) / sum by (env) (rate(centcom_relay_fanout_latency_seconds_count[30m])))
        labels:
          slo: relay-fanout
      - record: slo:burn_rate:30m
        expr: slo:sli_error:ratio_rate30m{slo="relay-fanout"} / (1 - 0.99)
        labels:
          slo: relay-fanout
  - name: slo-windows-resume-success
    interval: 1m
    rules:
      - record: slo:sli_error:ratio_rate30m
        expr: 1 - (sum by (env) (rate(centcom_relay_resume_duration_seconds_bucket{result="ok", le="5"}[30m])) / sum by (env) (rate(centcom_relay_resume_duration_seconds_count[30m])))
        labels:
          slo: resume-success
      - record: slo:burn_rate:30m
        expr: slo:sli_error:ratio_rate30m{slo="resume-success"} / (1 - 0.99)
        labels:
          slo: resume-success
  - name: slo-windows-stripe-webhook
    interval: 1m
    rules:
      - record: slo:sli_error:ratio_rate30m
        expr: 1 - (sum by (env) (rate(centcom_stripe_webhook_lag_seconds_bucket{le="30"}[30m])) / sum by (env) (rate(centcom_stripe_webhook_lag_seconds_count[30m])))
        labels:
          slo: stripe-webhook
      - record: slo:burn_rate:30m
        expr: slo:sli_error:ratio_rate30m{slo="stripe-webhook"} / (1 - 0.99)
        labels:
          slo: stripe-webhook
  - name: slo-windows-webhook-delivery
    interval: 1m
    rules:
      - record: slo:sli_error:ratio_rate30m
        expr: 1 - (sum by (env) (rate(centcom_webhook_first_attempt_seconds_bucket{result="ok", le="10"}[30m])) / sum by (env) (rate(centcom_webhook_first_attempt_seconds_count[30m])))
        labels:
          slo: webhook-delivery
      - record: slo:burn_rate:30m
        expr: slo:sli_error:ratio_rate30m{slo="webhook-delivery"} / (1 - 0.95)
        labels:
          slo: webhook-delivery
