# Data-retention alerts (B094): B090's retention runs (`centcom_retention_aborted_total`, catalogued
# by B090) and B085's telemetry retention.
groups:
  - name: alerts-retention
    interval: 1m
    rules:
      # A retention run aborted (B090's safety brake) or a telemetry retention run failed for good
      # (B085) in the last hour. Both counters appear only on the first failure, so a series that
      # is new within the hour counts too (increase() needs two samples).
      - alert: RetentionJobFailed
        expr: |
          sum by (env) (increase(centcom_retention_aborted_total[1h])) > 0
          or sum by (env) (centcom_retention_aborted_total unless centcom_retention_aborted_total offset 1h) > 0
          or sum by (env) (increase(centcom_telemetry_retention_failed_total[1h])) > 0
          or sum by (env) (centcom_telemetry_retention_failed_total unless centcom_telemetry_retention_failed_total offset 1h) > 0
        labels:
          severity: ticket
          service: retention
          owner: platform
          runbook: infra/runbooks/alerts/RetentionJobFailed.md
        annotations:
          summary: 'A data-retention run failed or was aborted in {{ $labels.env }} in the last hour.'
          impact: 'Data past its retention period is kept longer than the policy allows (a privacy commitment), and the next run has more to delete.'
          dashboard: '/d/centcom-workers-queues?var-env={{ $labels.env }}'
