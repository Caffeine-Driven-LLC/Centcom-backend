# promtool unit tests for api.rules.yaml (B094): `pnpm alerts:test`, and in CI
# infra/alerts/test/alerts.containers.test.ts. Expected labels and annotations are the rule's,
# with the series' labels filled in; infra/alerts/test/alerts.policy.test.ts checks they still
# match the rules.
rule_files:
  - ../../observability/slo/rules.yaml
  - ../recording/slo-30m.rules.yaml
  - api.rules.yaml

evaluation_interval: 1m

tests:
  # Card acceptance: a 1.44 % error rate for 1 h fires ApiAvailabilityFastBurn (144 of
  # every 10 000 requests are 5xx: a burn rate of exactly 14.4 against the 0.1 % budget).
  - interval: 1m
    input_series:
      - series: 'centcom_http_requests_total{route="/v1/me", method="GET", status_class="2xx", env="prod", region="eu"}'
        values: '0+9856x60'
      - series: 'centcom_http_requests_total{route="/v1/me", method="GET", status_class="5xx", env="prod", region="eu"}'
        values: '0+144x60'
      - series: 'centcom_http_requests_total{route="/readyz", method="GET", status_class="5xx", env="prod", region="eu"}'
        values: '0+5000x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ApiAvailabilityFastBurn
        exp_alerts:
          - exp_labels:
              env: 'prod'
              owner: 'platform'
              runbook: 'infra/runbooks/alerts/ApiAvailabilityFastBurn.md'
              service: 'api'
              severity: 'page'
              slo: 'api-availability'
            exp_annotations:
              dashboard: '/d/centcom-api-overview?var-env=prod'
              impact: 'Customers get errors from the API: sign-in, workspaces, billing and session setup fail. At this rate the 30-day budget is gone in 2 days.'
              summary: 'API 5xx answers are spending the availability error budget 14.4x too fast in prod.'

  # Card acceptance: 0.2 % for 1 h does not fire (a burn rate of 2): neither the fast nor the
  # slow burn, nor the ticket.
  - interval: 1m
    input_series:
      - series: 'centcom_http_requests_total{route="/v1/me", method="GET", status_class="2xx", env="prod", region="eu"}'
        values: '0+9980x60'
      - series: 'centcom_http_requests_total{route="/v1/me", method="GET", status_class="5xx", env="prod", region="eu"}'
        values: '0+20x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ApiAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 60m
        alertname: ApiAvailabilitySlowBurn
        exp_alerts: []

  # Slow burn: 0.6 % for 6 h (burn rate 6) pages ApiAvailabilitySlowBurn, and the 3-day tier
  # (3x) has opened its ticket; the fast burn stays quiet.
  - interval: 1m
    input_series:
      - series: 'centcom_http_requests_total{route="/v1/me", method="GET", status_class="2xx", env="prod", region="eu"}'
        values: '0+9940x360'
      - series: 'centcom_http_requests_total{route="/v1/me", method="GET", status_class="5xx", env="prod", region="eu"}'
        values: '0+60x360'
    alert_rule_test:
      - eval_time: 360m
        alertname: ApiAvailabilitySlowBurn
        exp_alerts:
          - exp_labels:
              env: 'prod'
              owner: 'platform'
              runbook: 'infra/runbooks/alerts/ApiAvailabilitySlowBurn.md'
              service: 'api'
              severity: 'page'
              slo: 'api-availability'
            exp_annotations:
              dashboard: '/d/centcom-api-overview?var-env=prod'
              impact: 'A steady share of API requests fails for customers. At this rate the 30-day budget is gone in 5 days.'
              summary: 'API 5xx answers have spent the availability error budget 6x too fast for 6 hours in prod.'
          - exp_labels:
              env: 'prod'
              owner: 'platform'
              runbook: 'infra/runbooks/alerts/ApiAvailabilitySlowBurn.md'
              service: 'api'
              severity: 'ticket'
              slo: 'api-availability'
            exp_annotations:
              dashboard: '/d/centcom-api-overview?var-env=prod'
              impact: 'A small, persistent share of API requests fails. At this rate the 30-day budget is gone in 10 days.'
              summary: 'API 5xx answers have spent the availability error budget 3x too fast for 3 days in prod.'
      - eval_time: 360m
        alertname: ApiAvailabilityFastBurn
        exp_alerts: []

  # 0.5 % for 6 h (burn rate 5) is under the slow page's 6x: only the ticket (3x) fires.
  - interval: 1m
    input_series:
      - series: 'centcom_http_requests_total{route="/v1/me", method="GET", status_class="2xx", env="prod", region="eu"}'
        values: '0+9950x360'
      - series: 'centcom_http_requests_total{route="/v1/me", method="GET", status_class="5xx", env="prod", region="eu"}'
        values: '0+50x360'
    alert_rule_test:
      - eval_time: 360m
        alertname: ApiAvailabilitySlowBurn
        exp_alerts:
          - exp_labels:
              env: 'prod'
              owner: 'platform'
              runbook: 'infra/runbooks/alerts/ApiAvailabilitySlowBurn.md'
              service: 'api'
              severity: 'ticket'
              slo: 'api-availability'
            exp_annotations:
              dashboard: '/d/centcom-api-overview?var-env=prod'
              impact: 'A small, persistent share of API requests fails. At this rate the 30-day budget is gone in 10 days.'
              summary: 'API 5xx answers have spent the availability error budget 3x too fast for 3 days in prod.'

  # Latency: 80 % of answers over 300 ms against the 95 % objective (burn rate 16) pages in
  # prod; 2 % slow in stage (burn rate 0.4) does not.
  - interval: 1m
    input_series:
      - series: 'centcom_http_request_duration_seconds_bucket{route="/v1/me", method="GET", le="0.3", env="prod", region="eu"}'
        values: '0+20x60'
      - series: 'centcom_http_request_duration_seconds_count{route="/v1/me", method="GET", env="prod", region="eu"}'
        values: '0+100x60'
      - series: 'centcom_http_request_duration_seconds_bucket{route="/v1/me", method="GET", le="0.3", env="stage", region="eu"}'
        values: '0+98x60'
      - series: 'centcom_http_request_duration_seconds_count{route="/v1/me", method="GET", env="stage", region="eu"}'
        values: '0+100x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: ApiLatencyBurn
        exp_alerts:
          - exp_labels:
              env: 'prod'
              owner: 'platform'
              runbook: 'infra/runbooks/alerts/ApiLatencyBurn.md'
              service: 'api'
              severity: 'page'
              slo: 'api-latency'
            exp_annotations:
              dashboard: '/d/centcom-api-overview?var-env=prod'
              impact: 'Customers wait on the API: the client and the web app feel slow or time out.'
              summary: 'API answers slower than 300 ms are spending the latency error budget too fast (6x or more) in prod.'

  # Stripe SLO: 20 % of events processed later than 30 s (burn rate 20) pages
  # StripeWebhookLag.
  - interval: 1m
    input_series:
      - series: 'centcom_stripe_webhook_lag_seconds_bucket{type="invoice.paid", le="30", env="prod", region="eu"}'
        values: '0+80x60'
      - series: 'centcom_stripe_webhook_lag_seconds_count{type="invoice.paid", env="prod", region="eu"}'
        values: '0+100x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: StripeWebhookLag
        exp_alerts:
          - exp_labels:
              env: 'prod'
              owner: 'billing'
              runbook: 'infra/runbooks/alerts/StripeWebhookLag.md'
              service: 'api'
              severity: 'page'
              slo: 'stripe-webhook'
            exp_annotations:
              dashboard: '/d/centcom-billing-stripe?var-env=prod'
              impact: 'Customers who pay, upgrade or cancel do not see the change: plans, seats and limits stay stale until the events are processed.'
              summary: 'Stripe events are processed late in prod: the stripe-webhook SLO is burning fast, or the stripe.event.process queue is over 10 minutes old or 100 deep.'

  # Stripe queue (cause): in prod the oldest waiting event passes 10 minutes at 11m (pages
  # from 13m, after `for: 2m`); in stage 150 events wait from the start.
  - interval: 1m
    input_series:
      - series: 'centcom_queue_oldest_age_seconds{queue="stripe.event.process", env="prod", region="eu"}'
        values: '0+60x20'
      - series: 'centcom_queue_depth{queue="stripe.event.process", env="prod", region="eu"}'
        values: '3x20'
      - series: 'centcom_queue_oldest_age_seconds{queue="stripe.event.process", env="stage", region="eu"}'
        values: '30x20'
      - series: 'centcom_queue_depth{queue="stripe.event.process", env="stage", region="eu"}'
        values: '150x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: StripeWebhookLag
        exp_alerts:
          - exp_labels:
              env: 'stage'
              owner: 'billing'
              runbook: 'infra/runbooks/alerts/StripeWebhookLag.md'
              service: 'api'
              severity: 'page'
              slo: 'stripe-webhook'
            exp_annotations:
              dashboard: '/d/centcom-billing-stripe?var-env=stage'
              impact: 'Customers who pay, upgrade or cancel do not see the change: plans, seats and limits stay stale until the events are processed.'
              summary: 'Stripe events are processed late in stage: the stripe-webhook SLO is burning fast, or the stripe.event.process queue is over 10 minutes old or 100 deep.'
      - eval_time: 15m
        alertname: StripeWebhookLag
        exp_alerts:
          - exp_labels:
              env: 'prod'
              owner: 'billing'
              runbook: 'infra/runbooks/alerts/StripeWebhookLag.md'
              service: 'api'
              severity: 'page'
              slo: 'stripe-webhook'
            exp_annotations:
              dashboard: '/d/centcom-billing-stripe?var-env=prod'
              impact: 'Customers who pay, upgrade or cancel do not see the change: plans, seats and limits stay stale until the events are processed.'
              summary: 'Stripe events are processed late in prod: the stripe-webhook SLO is burning fast, or the stripe.event.process queue is over 10 minutes old or 100 deep.'
          - exp_labels:
              env: 'stage'
              owner: 'billing'
              runbook: 'infra/runbooks/alerts/StripeWebhookLag.md'
              service: 'api'
              severity: 'page'
              slo: 'stripe-webhook'
            exp_annotations:
              dashboard: '/d/centcom-billing-stripe?var-env=stage'
              impact: 'Customers who pay, upgrade or cancel do not see the change: plans, seats and limits stay stale until the events are processed.'
              summary: 'Stripe events are processed late in stage: the stripe-webhook SLO is burning fast, or the stripe.event.process queue is over 10 minutes old or 100 deep.'
