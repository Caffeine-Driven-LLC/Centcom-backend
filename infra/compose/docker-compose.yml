# Local development stack (B012): Postgres 16, Redis 7, MinIO (the S3 API, standing in for R2) and
# Mailpit (a mail catcher). `pnpm dev:up` (tools/dev/up.sh) starts it, migrates and seeds it;
# docs/dev-environment.md says how to use it. It is for one developer's machine only: nothing here
# is used by tests, CI, staging or production.
#
# - Every port is published on 127.0.0.1 only, never on all interfaces. Each host port can be
#   moved with the CENTCOM_DEV_* variable in front of it.
# - The fixed password is `dev-only` everywhere; no value here is valid outside this stack.
# - Data lives in named volumes; `pnpm dev:reset` removes them.
name: centcom-dev

services:
  postgres:
    # The version the test harness (B010) and CI use.
    image: postgres:16
    environment:
      POSTGRES_USER: centcom
      POSTGRES_PASSWORD: dev-only
      POSTGRES_DB: centcom_dev
    ports:
      - '127.0.0.1:${CENTCOM_DEV_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '--username=centcom', '--dbname=centcom_dev']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${CENTCOM_DEV_REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # MinIO no longer publishes minio/minio images; this is Bitnami's frozen build of the
    # 2025-07-23 release. minio-init.sh speaks plain S3, so any S3-compatible image can replace it.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: centcom
      MINIO_ROOT_PASSWORD: dev-only
    ports:
      - '127.0.0.1:${CENTCOM_DEV_MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${CENTCOM_DEV_MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/bitnami/minio/data
      - ./minio-init.sh:/opt/centcom/minio-init.sh:ro
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:9000/minio/health/live']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.4
    environment:
      MP_DATABASE: /data/mailpit.db
      # Any SMTP login is accepted, over plain text: the services' mail settings need no account.
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '127.0.0.1:${CENTCOM_DEV_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${CENTCOM_DEV_MAILPIT_PORT:-8025}:8025'
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mailpit-data:
