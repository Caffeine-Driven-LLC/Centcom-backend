# Generated by infra/fly/gen.mjs from infra/terraform/envs/dev/terraform.tfvars.json. Do not edit.
# Secrets this app reads (names only, set with `fly secrets set -a centcom-dev-admin`): DATABASE_URL
app = "centcom-dev-admin"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[env]
  NODE_ENV = "production"
  SERVICE_NAME = "admin"
  HOST = "0.0.0.0"
  PORT = "8083"
  LOG_LEVEL = "debug"
  PUBLIC_API_URL = "https://api.dev.centcom.example"

[checks.healthz]
  type = "http"
  port = 8083
  method = "GET"
  path = "/healthz"
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"

[checks.readyz]
  type = "http"
  port = 8083
  method = "GET"
  path = "/readyz"
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
