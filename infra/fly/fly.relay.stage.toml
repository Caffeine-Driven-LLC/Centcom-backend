# Generated by infra/fly/gen.mjs from infra/terraform/envs/stage/terraform.tfvars.json. Do not edit.
# Secrets this app reads (names only, set with `fly secrets set -a centcom-stage-relay`): DATABASE_URL REDIS_URL
app = "centcom-stage-relay"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[env]
  NODE_ENV = "production"
  SERVICE_NAME = "relay"
  HOST = "0.0.0.0"
  PORT = "8081"
  LOG_LEVEL = "info"
  PUBLIC_API_URL = "https://api.stage.centcom.example"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[checks.healthz]
  type = "http"
  port = 8081
  method = "GET"
  path = "/healthz"
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"

[checks.readyz]
  type = "http"
  port = 8081
  method = "GET"
  path = "/readyz"
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
