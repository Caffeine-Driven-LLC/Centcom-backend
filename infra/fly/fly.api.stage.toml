# Generated by infra/fly/gen.mjs from infra/terraform/envs/stage/terraform.tfvars.json. Do not edit.
# Secrets this app reads (names only, set with `fly secrets set -a centcom-stage-api`): DATABASE_URL REDIS_URL AUTH_SIGNING_KEYS IDEMPOTENCY_ENCRYPTION_KEY CURSOR_SIGNING_KEYS OBJECT_STORE_ACCESS_KEY_ID OBJECT_STORE_SECRET_ACCESS_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET
app = "centcom-stage-api"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[env]
  NODE_ENV = "production"
  SERVICE_NAME = "api"
  HOST = "0.0.0.0"
  PORT = "8080"
  LOG_LEVEL = "info"
  PUBLIC_API_URL = "https://api.stage.centcom.example"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

[checks.healthz]
  type = "http"
  port = 8080
  method = "GET"
  path = "/healthz"
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"

[checks.readyz]
  type = "http"
  port = 8080
  method = "GET"
  path = "/readyz"
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
