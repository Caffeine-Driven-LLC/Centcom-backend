# Generated by infra/fly/gen.mjs from infra/terraform/envs/prod/terraform.tfvars.json. Do not edit.
# Secrets this app reads (names only, set with `fly secrets set -a centcom-prod-worker`): DATABASE_URL REDIS_URL OBJECT_STORE_ACCESS_KEY_ID OBJECT_STORE_SECRET_ACCESS_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET RESEND_API_KEY
app = "centcom-prod-worker"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[env]
  NODE_ENV = "production"
  SERVICE_NAME = "worker"
  HOST = "0.0.0.0"
  PORT = "8082"
  LOG_LEVEL = "info"
  PUBLIC_API_URL = "https://api.centcom.example"

[checks.healthz]
  type = "http"
  port = 8082
  method = "GET"
  path = "/healthz"
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"

[checks.readyz]
  type = "http"
  port = 8082
  method = "GET"
  path = "/readyz"
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "1024mb"
