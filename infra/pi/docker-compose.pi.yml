# A small Centcom server for a Raspberry Pi 4 (4 GB) (B112). FOR TESTING ONLY: development-grade settings, an
# in-memory mail catcher, no backups, and a private certificate authority for HTTPS on the local network.
#
# Why one compose file and not one image: the B091 images (api, relay, worker) are reused unchanged, so what is
# tried here is the product's own code; Postgres, Redis, MinIO, Mailpit and Caddy are the stock multi-arch images.
#
#   infra/pi/up.sh            builds the images, makes the secrets, starts everything, prints the client settings
#
# Never run this file by hand without up.sh: it needs the generated settings (infra/pi/.state/pi.env). Every
# service has a memory limit; together the limits are about 2.7 GB, and the stack idles at well under 2 GB.
name: ${PI_PROJECT:-centcom-pi}

x-logging: &logging
  driver: json-file
  options: { max-size: '5m', max-file: '2' }

x-service: &service
  restart: unless-stopped
  logging: *logging
  security_opt: ['no-new-privileges:true']

# One Node heap cap per service keeps a leak from eating the board.
x-node: &node
  NODE_OPTIONS: --max-old-space-size=256

x-api-env: &api-env
  <<: *node
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PUBLIC_API_URL: ${PI_PUBLIC_API_URL:?run infra/pi/up.sh}
  DATABASE_URL: postgres://centcom:${POSTGRES_PASSWORD:?run infra/pi/up.sh}@postgres:5432/centcom
  REDIS_URL: redis://:${REDIS_PASSWORD:?run infra/pi/up.sh}@redis:6379/0
  ALLOW_INSECURE_BACKENDS: '1'
  TRUSTED_PROXY_HOPS: '1'
  AUTH_SIGNING_KEYS: ${AUTH_SIGNING_KEYS:?run infra/pi/up.sh}
  AUTH_SIGNING_KID: ${AUTH_SIGNING_KID:?run infra/pi/up.sh}
  IDEMPOTENCY_ENCRYPTION_KEY: ${IDEMPOTENCY_ENCRYPTION_KEY:?run infra/pi/up.sh}
  CURSOR_SIGNING_KEYS: ${CURSOR_SIGNING_KEYS:?run infra/pi/up.sh}
  # Mail: sign-in codes and links go to Mailpit (read them in a browser); nothing is sent anywhere.
  DEV_MAILPIT_URL: http://mailpit:8025
  EMAIL_PROVIDER: console
  EMAIL_FROM: Centcom <no-reply@centcom.test>
  WEB_BASE_URL: https://centcom.dev
  MAGIC_LINK_BASE_URL: ${PI_PUBLIC_API_URL}
  LOGIN_RETURN_TO_ALLOWLIST: ${PI_PUBLIC_API_URL}/device
  DEVICE_VERIFICATION_URI: ${PI_PUBLIC_API_URL}/device
  RELAY_PUBLIC_URL: ${PI_RELAY_PUBLIC_URL:?run infra/pi/up.sh}
  RELAY_REGION: pi
  # No billing on this server: every new personal workspace is on the Team plan, so a Free account can host sessions.
  SELF_HOST_PLAN: team
  RATELIMIT_AUTH_LIMIT: '200'
  RATELIMIT_ANONYMOUS_LIMIT: '300'
  OBJECT_STORE_ENDPOINT: http://minio:9000
  OBJECT_STORE_REGION: us-east-1
  OBJECT_STORE_BUCKET: history
  OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:?run infra/pi/up.sh}
  OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:?run infra/pi/up.sh}

services:
  # The plain router: /v1/ws to the relay, everything else to the API. It is published on the loopback address
  # only (Tailscale `serve` and the Cloudflare tunnel connect to it) and is what the other edge services use.
  caddy:
    <<: *service
    image: caddy:2.10-alpine
    mem_limit: 64m
    ports:
      - '127.0.0.1:${PI_LOCAL_PORT:-8081}:8081'
    volumes:
      - ./Caddyfile.router:/etc/caddy/Caddyfile:ro
    networks: [backend]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8081/healthz']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      api: { condition: service_healthy }
      relay: { condition: service_healthy }

  # LAN mode (profile `lan`, the default of up.sh): HTTPS on the local network with a private certificate
  # authority, because the Centcom apps refuse plain http and ws to any address that is not localhost. Plain HTTP
  # is served only to download the CA certificate (http://<pi>/ca.crt).
  caddy-tls:
    <<: *service
    image: caddy:2.10-alpine
    profiles: ['lan']
    mem_limit: 96m
    cap_add: ['NET_BIND_SERVICE']
    ports:
      - '${PI_HTTP_PORT:-80}:${PI_HTTP_PORT:-80}'
      - '${PI_HTTPS_PORT:-443}:${PI_HTTPS_PORT:-443}'
    environment:
      PI_HOST: ${PI_HOST:?run infra/pi/up.sh}
      PI_HTTP_PORT: ${PI_HTTP_PORT:-80}
      PI_HTTPS_PORT: ${PI_HTTPS_PORT:-443}
    volumes:
      - ./Caddyfile.tls:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend]
    healthcheck:
      # the private CA certificate exists once the first certificate was issued
      test: ['CMD-SHELL', 'test -s /data/caddy/pki/authorities/local/root.crt']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    depends_on:
      api: { condition: service_healthy }
      relay: { condition: service_healthy }

  api:
    <<: *service
    build: &build
      context: ../..
      dockerfile: infra/deploy/Dockerfile
      target: api
    image: centcom-api:${PI_TAG:-pi}
    mem_limit: 384m
    environment:
      <<: *api-env
      SERVICE_NAME: api
    read_only: true
    tmpfs: ['/tmp']
    networks: [backend]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 40s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    <<: *service
    build:
      <<: *build
      target: worker
    image: centcom-worker:${PI_TAG:-pi}
    mem_limit: 256m
    environment:
      <<: *api-env
      SERVICE_NAME: worker
    read_only: true
    tmpfs: ['/tmp']
    networks: [backend]
    # The worker listens on no port. This only proves the container's process is up; the jobs it runs are
    # watched with `infra/pi/logs.sh worker`.
    healthcheck:
      test: ['CMD', 'node', '-e', 'process.exit(0)']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  relay:
    <<: *service
    build:
      <<: *build
      target: relay
    image: centcom-relay:${PI_TAG:-pi}
    mem_limit: 384m
    stop_grace_period: 40s
    ulimits:
      nofile: { soft: 16384, hard: 16384 }
    environment:
      <<: *node
      NODE_ENV: production
      SERVICE_NAME: relay
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_API_URL: ${PI_PUBLIC_API_URL}
      DATABASE_URL: postgres://centcom:${POSTGRES_PASSWORD}@postgres:5432/centcom
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ALLOW_INSECURE_BACKENDS: '1'
      RELAY_REGION: pi
      RELAY_JWKS_URL: http://api:3000/.well-known/jwks.json
      RELAY_MAX_CONNECTIONS: '300'
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_REGION: us-east-1
      OBJECT_STORE_BUCKET: history
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY}
    read_only: true
    tmpfs: ['/tmp']
    networks: [backend]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 40s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
      minio: { condition: service_healthy }

  # One-shot: applies the migrations (`up.sh` runs it before the API starts).
  migrate:
    build:
      <<: *build
      target: api
    image: centcom-api:${PI_TAG:-pi}
    profiles: ['tools']
    command: ['node', 'node_modules/@centcom/db/dist/cli.js', 'migrate']
    mem_limit: 256m
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://centcom:${POSTGRES_PASSWORD}@postgres:5432/centcom
      ALLOW_INSECURE_BACKENDS: '1'
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    <<: *service
    image: postgres:16
    mem_limit: 512m
    # Tuned for a 4 GB board: small buffers, few connections, relaxed commits (a test server may lose the last
    # moment of data in a power cut, never its consistency).
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - synchronous_commit=off
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=512MB
    environment:
      POSTGRES_USER: centcom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run infra/pi/up.sh}
      POSTGRES_DB: centcom
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ['CMD', 'pg_isready', '--username=centcom', '--dbname=centcom']
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: []

  redis:
    <<: *service
    image: redis:7
    mem_limit: 160m
    # No persistence (less writing to the disk); BullMQ needs noeviction.
    command:
      - sh
      - -c
      - exec redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run infra/pi/up.sh}
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: []

  # The relay's durable log, session history and snapshots. The same image as the production stack.
  minio:
    <<: *service
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    mem_limit: 384m
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY_ID:?run infra/pi/up.sh}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_ACCESS_KEY:?run infra/pi/up.sh}
      GOMEMLIMIT: 256MiB
    volumes:
      - minio-data:/bitnami/minio/data
      - ../compose/minio-init.sh:/opt/centcom/minio-init.sh:ro
    networks: [backend]
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 3s
      retries: 20
    security_opt: []

  minio-init:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: 'no'
    mem_limit: 128m
    entrypoint: ['bash', '/opt/centcom/minio-init.sh']
    environment:
      S3_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY_ID:?run infra/pi/up.sh}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_ACCESS_KEY:?run infra/pi/up.sh}
    volumes:
      - ../compose/minio-init.sh:/opt/centcom/minio-init.sh:ro
    networks: [backend]
    depends_on:
      minio: { condition: service_healthy }

  # Sign-in codes and links land here, in memory (they are gone after a restart). Open http://<pi>:8025.
  mailpit:
    <<: *service
    image: axllent/mailpit:v1.31.4
    mem_limit: 96m
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      MP_MAX_MESSAGES: '200'
    ports:
      - '${PI_MAIL_PORT:-8025}:8025'
    networks: [backend]
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 6

  # Optional edge (profile `tunnel`): a Cloudflare Tunnel, so the server is reachable without any open port.
  # In the Cloudflare dashboard point the tunnel's public hostname at http://caddy:8081.
  cloudflared:
    <<: *service
    image: cloudflare/cloudflared:2025.9.0
    profiles: ['tunnel']
    mem_limit: 128m
    command: ['tunnel', '--no-autoupdate', '--metrics', '127.0.0.1:2000', 'run']
    environment:
      # up.sh --edge tunnel refuses to start without a token
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [backend]
    healthcheck:
      test: ['CMD', 'cloudflared', 'tunnel', '--metrics', '127.0.0.1:2000', 'ready']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      caddy: { condition: service_healthy }

networks:
  # One private bridge: only Caddy and Mailpit publish ports, and nothing is published to the internet by this file.
  backend: {}

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
